<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>atelier｜道具棚</title>
<meta name="description" content="JSON と SQL を整形する道具棚。テキストはブラウザ内だけで処理されます。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Zen+Old+Mincho:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/vendor/sql-formatter.min.js"></script>
<script defer src="assets/app.js"></script>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-en">atelier</span>
    <span class="brand-ja">道具棚</span>
  </div>
  <div class="pill-toggle" id="themeToggle" role="button" aria-label="テーマ切り替え" tabindex="0">
    <span class="pill-label active" id="labelLight">light</span>
    <div class="pill-track"><div class="pill-thumb"></div></div>
    <span class="pill-label" id="labelDark">dark</span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="ツール">
  <button class="tab" id="tab-json" role="tab" aria-selected="true" aria-controls="panel-json" data-tab="json">JSON</button>
  <button class="tab" id="tab-sql" role="tab" aria-selected="false" aria-controls="panel-sql" data-tab="sql">SQL</button>
</nav>

<main>
  <!-- ─────────── JSON ─────────── -->
  <section class="panel" id="panel-json" role="tabpanel" aria-labelledby="tab-json">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="opt">
          <span class="toolbar-label">Indent</span>
          <div class="seg" id="segJsonIndent" role="group" aria-label="インデント幅">
            <button type="button" class="seg-btn" data-value="2">2</button>
            <button type="button" class="seg-btn" data-value="4">4</button>
          </div>
        </div>
      </div>
      <div class="toolbar-right">
        <button type="button" class="btn btn-primary" id="jsonFormat">Format</button>
        <button type="button" class="btn" id="jsonMinify">Minify</button>
        <button type="button" class="btn" id="jsonCopy">Copy</button>
        <button type="button" class="btn btn-ghost" id="jsonClear">Clear</button>
      </div>
    </div>

    <p class="status" id="jsonStatus" role="status" aria-live="polite"></p>

    <div class="editor-grid">
      <div class="card">
        <div class="card-head">
          <span class="badge">Input</span>
          <span class="meta" id="jsonInMeta">0 chars</span>
        </div>
        <textarea class="editor wrap" id="jsonInput" spellcheck="false" autocapitalize="off" autocorrect="off"
          aria-label="JSON 入力" placeholder='{"tool":"json formatter","tags":["blåsippa","atelier"]}'></textarea>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="badge">Output</span>
          <span class="meta" id="jsonOutMeta">0 lines</span>
        </div>
        <textarea class="editor" id="jsonOutput" readonly spellcheck="false" aria-label="整形結果"></textarea>
      </div>
    </div>
  </section>

  <!-- ─────────── SQL ─────────── -->
  <section class="panel" id="panel-sql" role="tabpanel" aria-labelledby="tab-sql" hidden>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="opt">
          <span class="toolbar-label">Dialect</span>
          <select class="select" id="sqlDialect" aria-label="SQL の方言">
            <option value="sql">Standard</option>
            <option value="mysql">MySQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="transactsql">SQL Server</option>
            <option value="plsql">Oracle</option>
            <option value="sqlite">SQLite</option>
            <option value="access">Access</option>
          </select>
        </div>
        <div class="opt">
          <span class="toolbar-label">Indent</span>
          <div class="seg" id="segSqlIndent" role="group" aria-label="インデント幅">
            <button type="button" class="seg-btn" data-value="tab">Tab</button>
            <button type="button" class="seg-btn" data-value="2">2</button>
            <button type="button" class="seg-btn" data-value="4">4</button>
          </div>
        </div>
        <div class="opt">
          <span class="toolbar-label">Keyword</span>
          <div class="seg" id="segSqlKeyword" role="group" aria-label="予約語の大文字小文字">
            <button type="button" class="seg-btn" data-value="upper">UPPER</button>
            <button type="button" class="seg-btn" data-value="lower">lower</button>
            <button type="button" class="seg-btn" data-value="preserve">as-is</button>
          </div>
        </div>
        <div class="opt">
          <span class="toolbar-label">And &middot; Or</span>
          <div class="seg" id="segSqlLogical" role="group" aria-label="AND / OR の改行位置">
            <button type="button" class="seg-btn" data-value="before">before</button>
            <button type="button" class="seg-btn" data-value="after">after</button>
          </div>
        </div>
      </div>
      <div class="toolbar-right">
        <button type="button" class="btn btn-primary" id="sqlFormat">Format</button>
        <button type="button" class="btn" id="sqlOneLine">One line</button>
        <button type="button" class="btn" id="sqlCopy">Copy</button>
        <button type="button" class="btn btn-ghost" id="sqlSample">Sample</button>
        <button type="button" class="btn btn-ghost" id="sqlClear">Clear</button>
      </div>
    </div>

    <p class="status" id="sqlStatus" role="status" aria-live="polite"></p>

    <div class="editor-grid">
      <div class="card">
        <div class="card-head">
          <span class="badge">Input</span>
          <span class="meta" id="sqlInMeta">0 chars</span>
        </div>
        <textarea class="editor wrap" id="sqlInput" spellcheck="false" autocapitalize="off" autocorrect="off"
          aria-label="SQL 入力" placeholder="select * from users where status = 'active'"></textarea>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="badge">Output</span>
          <span class="meta" id="sqlOutMeta">0 lines</span>
        </div>
        <textarea class="editor" id="sqlOutput" readonly spellcheck="false" aria-label="整形結果"></textarea>
      </div>
    </div>
  </section>
</main>

<footer>
  <span class="footer-copy">&copy; atelier</span>
</footer>

</body>
</html>
